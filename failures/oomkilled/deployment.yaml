apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oom-demo
  template:
    metadata:
      labels:
        app: oom-demo
    spec:
      containers:
        - name: oom-demo
          image: polinux/stress
          command: ["sh", "-c", "stress --vm 1 --vm-bytes 512M --vm-hang 300"]
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
            requests:
              memory: "64Mi"
              cpu: "250m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false
